name: How to Fish iOS - v6 REAL IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  make_real_ipa:
    name: Build REAL unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Download successful v4 Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FIND LATEST v4 XCODE ARTIFACT ====="

          JSON="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=How-to-Fish-iOS-Xcode-v4&per_page=100"
          )"

          RUN_ID="$(
            printf '%s' "$JSON" \
              | jq -r '
                  [
                    .artifacts[]
                    | select(.expired == false)
                  ]
                  | sort_by(.created_at)
                  | reverse
                  | .[0].workflow_run.id // empty
                '
          )"

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: How-to-Fish-iOS-Xcode-v4 artifact was not found."
            echo "Run v4 once first."
            exit 1
          fi

          echo "Using v4 run: $RUN_ID"

          rm -rf unity-ios
          mkdir -p unity-ios

          gh run download "$RUN_ID" \
            -R "$GITHUB_REPOSITORY" \
            --name "How-to-Fish-iOS-Xcode-v4" \
            --dir unity-ios

          echo "===== DOWNLOADED ====="
          du -sh unity-ios || true
          find unity-ios -maxdepth 3 -type d -name '*.xcodeproj' -print

      - name: Locate Xcode project
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          PROJ="$(
            find unity-ios \
              -type d \
              -name '*.xcodeproj' \
              -print \
              | head -1
          )"

          if [ -z "$PROJ" ] || [ ! -f "$PROJ/project.pbxproj" ]; then
            echo "ERROR: Unity-iPhone.xcodeproj not found."
            find unity-ios -maxdepth 5 -print | head -500
            exit 1
          fi

          ROOT="$(dirname "$PROJ")"

          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "XCODE_PROJECT=$PROJ" >> "$GITHUB_ENV"
          echo "XCODE_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "===== XCODE ====="
          xcodebuild -version
          echo
          echo "PROJECT=$PROJ"
          echo "ROOT=$ROOT"
          xcodebuild -list -project "$PROJ"

      - name: Fix missing PrivacyInfo.xcprivacy
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FIX PrivacyInfo.xcprivacy ====="

          TARGET="$XCODE_ROOT/UnityFramework/PrivacyInfo.xcprivacy"
          mkdir -p "$(dirname "$TARGET")"

          cat > "$TARGET" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyTrackingDomains</key>
              <array/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$TARGET"
          ls -lh "$TARGET"
          cat "$TARGET"

      - name: Enable Files app runtime logs
        shell: bash
        run: |
          set -euo pipefail

          PLIST="$(
            find "$XCODE_ROOT" \
              -type f \
              -name 'Info.plist' \
              ! -path '*/UnityFramework/*' \
              -print \
              | head -1
          )"

          if [ -z "$PLIST" ]; then
            echo "WARNING: app Info.plist was not found before build."
            exit 0
          fi

          /usr/libexec/PlistBuddy \
            -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          echo "Patched: $PLIST"

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf DerivedData xcode-build.log

          echo "===== BUILD REAL DEVICE APP ====="

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee xcode-build.log

          echo
          echo "===== XCODE BUILD SUCCEEDED ====="

      - name: Validate built app is real
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find DerivedData/Build/Products/Release-iphoneos \
              -maxdepth 2 \
              -type d \
              -name '*.app' \
              -print \
              | head -1
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: .app was not produced."
            exit 1
          fi

          if [ ! -s "$APP/Info.plist" ]; then
            echo "ERROR: app has no valid Info.plist."
            exit 1
          fi

          EXEC="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )"

          if [ -z "$EXEC" ] || [ ! -s "$APP/$EXEC" ]; then
            echo "ERROR: app executable is missing or empty."
            echo "Expected: $APP/$EXEC"
            exit 1
          fi

          APP_KB="$(du -sk "$APP" | awk '{print $1}')"

          if [ "$APP_KB" -lt 1024 ]; then
            echo "ERROR: app is suspiciously small: ${APP_KB} KB"
            exit 1
          fi

          echo "path=$APP" >> "$GITHUB_OUTPUT"

          echo "===== REAL APP VERIFIED ====="
          echo "APP=$APP"
          echo "EXECUTABLE=$EXEC"
          du -sh "$APP"
          ls -lh "$APP/$EXEC"

      - name: Package real unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.path }}"

          rm -rf Payload
          mkdir -p Payload
          cp -a "$APP" Payload/

          /usr/bin/xattr -cr Payload || true

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "How-to-Fish-iOS-v6-unsigned.ipa"

          IPA_SIZE="$(stat -f%z How-to-Fish-iOS-v6-unsigned.ipa)"

          if [ "$IPA_SIZE" -lt 1048576 ]; then
            echo "ERROR: IPA is too small: $IPA_SIZE bytes"
            exit 1
          fi

          echo "===== REAL IPA VERIFIED ====="
          ls -lh How-to-Fish-iOS-v6-unsigned.ipa
          echo "IPA_SIZE_BYTES=$IPA_SIZE"

          unzip -l How-to-Fish-iOS-v6-unsigned.ipa \
            | head -100

      - name: Upload REAL IPA
        uses: actions/upload-artifact@v4
        with:
          name: How-to-Fish-iOS-v6-REAL-IPA
          path: How-to-Fish-iOS-v6-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload Xcode log only if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: How-to-Fish-iOS-v6-Xcode-Log
          path: xcode-build.log
          if-no-files-found: ignore
          compression-level: 0
